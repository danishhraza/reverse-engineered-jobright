<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Autofill</title>
    <link rel="stylesheet" href="ui.css" />
    <style>
      body { padding: 14px; }
      header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
      #fill { width: 100%; padding: 11px; font-size: 14px; margin: 10px 0 6px; }
      .modes { display: flex; gap: 6px; margin-bottom: 8px; }
      .modes button { flex: 1; font-size: 12px; }
      .modes kbd { font: 11px ui-monospace, Consolas, monospace; color: var(--muted); }
      #learnBox { margin: 10px 0; border-color: var(--focus); }
      #learnBox h3 { margin: 0 0 6px; font-size: 13px; }
      .learn { display: flex; gap: 8px; align-items: flex-start; padding: 6px 0; border-top: 1px solid var(--border); }
      .learn .q { font-weight: 600; overflow-wrap: anywhere; }
      .learn .a { overflow-wrap: anywhere; }
      .learn .prev { color: var(--muted); font-size: 12px; text-decoration: line-through; overflow-wrap: anywhere; }
      .learn button { padding: 4px 9px; font-size: 14px; line-height: 1; }
      .learn .yes { color: var(--accent); }
      .learn .no { color: var(--bad); }
      .field .val { white-space: pre-line; }
      #status { min-height: 18px; }
      #now { display: flex; align-items: center; gap: 8px; margin: 4px 0 8px; padding: 8px 10px; border: 1px solid var(--focus); border-radius: 8px; }
      #now[hidden] { display: none; }
      #now .spin { width: 10px; height: 10px; flex: none; border-radius: 50%; border: 2px solid var(--focus); border-right-color: transparent; animation: spin .8s linear infinite; }
      #now .txt { flex: 1; min-width: 0; overflow-wrap: anywhere; }
      #cancel { color: var(--bad); padding: 4px 10px; flex: none; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .field { display: flex; gap: 8px; align-items: flex-start; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 6px; cursor: pointer; background: var(--bg); }
      .field:hover { border-color: var(--focus); }
      .field .lbl { font-weight: 600; overflow-wrap: anywhere; }
      .field .why { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
      .field .val { font-size: 12px; overflow-wrap: anywhere; max-height: 7.5em; overflow: hidden; }
      details summary { cursor: pointer; color: var(--muted); margin: 10px 0 6px; }
      .settings { margin-top: 8px; }
      .empty { padding: 20px 0; text-align: center; }
    </style>
  </head>
  <body>
    <header>
      <h1>Autofill</h1>
      <a href="#" id="openOptions">Profiles &amp; settings</a>
    </header>
    <div class="card">
      <label class="muted" for="profile">Profile</label>
      <select id="profile"></select>
      <div class="settings">
        <label class="toggle"><input type="checkbox" id="autoAdvance" /> Go to next page automatically (Workday)</label>
        <label class="toggle"><input type="checkbox" id="learn" /> Learn answers I type into flagged fields (asks before saving)</label>
      </div>
    </div>
    <button id="fill" class="primary">Fill this page</button>
    <div class="modes">
      <button id="fillEmpty" title="Leave anything already filled (by you or the site's resume parser) alone">Only empty fields</button>
      <button id="fillFocused" title="Click into a field on the page first. Shortcut: Alt+Shift+D">Just the field I clicked <kbd>Alt+Shift+D</kbd></button>
    </div>
    <div id="learnBox" class="card" hidden></div>
    <div id="now" hidden><span class="spin"></span><span class="txt"></span><button id="cancel" title="Stop autofill (anything already filled stays)">Cancel</button></div>
    <div id="status" class="muted"></div>
    <div id="report"></div>
    <script src="sidepanel.js"></script>
  </body>
</html>
